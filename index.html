<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro Escolar | Acceso</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
<main class="login-shell">
  <section class="login-brand">
    <div class="brand-mark">CE</div>
    <span class="eyebrow">PLATAFORMA ESCOLAR</span>
    <h1>Centro Escolar</h1>
    <p>Un solo lugar para organizar materias, tareas, avisos, plataformas y reportes.</p>
  </section>
  <section class="login-card">
    <h2>Iniciar sesión</h2><p class="muted">Usa una de las cuentas de prueba.</p>
    <form id="loginForm">
      <label>Correo<input id="email" type="email" required placeholder="alumno@test.com"></label>
      <label>Contraseña<input id="password" type="password" required placeholder="123456"></label>
      <button class="btn primary full" type="submit">Entrar</button>
      <p id="loginError" class="error"></p>
    </form>
    <div class="demo-users">
      <strong>Accesos de prueba</strong>
      <button data-demo="admin@test.com">Admin</button><button data-demo="alumno@test.com">Alumno</button>
      <button data-demo="padre@test.com">Padre</button><button data-demo="soporte@test.com">Soporte</button>
    </div>
    <p class="security-note">Prototipo local: la autenticación no es segura para producción.</p>
  </section>
</main>
<script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script>
</body></html>
